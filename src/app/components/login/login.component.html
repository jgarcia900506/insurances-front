<div class="mx-auto">
  <form class="text-end" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group text-start m-4">
      <label for="username">Email address</label>
      <input id="username" type="email" formControlName="username" class="form-control"  aria-describedby="username" placeholder="Enter email">
      <!--small  *ngFor="let error of loginForm.username.errors; index as i;" class="form-text text-muted">{{ error }}</small-->
    </div>
    <div class="form-group text-start m-4">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control" placeholder="Password">
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
</div>
